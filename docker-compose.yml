name: task-tracker
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: task_tracker
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is missing, to define in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing, to define in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
