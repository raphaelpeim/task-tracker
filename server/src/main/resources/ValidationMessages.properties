# English sentences returned in "detail" for each validation error.
# The key (without braces) is returned in "code" so that the front can translate it.
# "invalidFormat" keys are used when the JSON value cannot be converted (text for a number, unknown enum value...).

task.title.required=Title is required
task.title.invalidSize=Title must be at most {max} characters
task.title.invalidFormat=Title must be a text
task.description.invalidSize=Description must be at most {max} characters
task.description.invalidFormat=Description must be a text
task.type.required=Type is required
task.type.invalidFormat=Type has an unknown value
task.status.required=Status is required
task.status.invalidFormat=Status has an unknown value
task.priority.required=Priority is required
task.priority.invalidFormat=Priority has an unknown value
task.assigneeId.invalidFormat=Assignee id must be a number
